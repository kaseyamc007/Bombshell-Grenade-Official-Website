<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="90" viewBox="0 0 520 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldMetal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Grenade & Flame Emblem -->
  <g transform="translate(10, 12)">
    <!-- Outer Grenade Pin / Ring -->
    <circle cx="34" cy="18" r="10" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <path d="M34 28 V 34" stroke="#ea580c" stroke-width="4"/>
    <!-- Grenade Body -->
    <rect x="18" y="34" width="32" height="30" rx="8" fill="#141419" stroke="url(#logoFlame)" stroke-width="2.5"/>
    <line x1="18" y1="44" x2="50" y2="44" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="18" y1="54" x2="50" y2="54" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="34" y1="34" x2="34" y2="64" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Flame Bursting from Top -->
    <path d="M34 4 C34 4 24 16 26 24 C28 30 34 32 34 32 C34 32 40 30 42 24 C44 16 34 4 34 4 Z" fill="url(#logoFlame)" filter="url(#flameGlow)"/>
    <path d="M34 14 C34 14 30 20 31 25 C32 28 34 29 34 29 C34 29 36 28 37 25 C38 20 34 14 34 14 Z" fill="#fffbeb"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(75, 42)">
    <text x="0" y="0" fill="url(#goldMetal)" font-family="'Cinzel', 'Montserrat', 'Syne', sans-serif" font-size="26" font-weight="900" letter-spacing="3">
      BOMB<tspan fill="#ea580c">$</tspan>HELL
    </text>
    <text x="185" y="0" fill="#ffffff" font-family="'Cinzel', 'Montserrat', 'Syne', sans-serif" font-size="26" font-weight="900" letter-spacing="3">
      GRENADE
    </text>
    <text x="2" y="20" fill="#ea580c" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="6">
      THE QUEEN OF ZAMBIAN HIP HOP
    </text>
  </g>
</svg>